<div class="container">

  <div class="cabecalho">
    <h1>Livros</h1>

    <button
      mat-raised-button
      color="primary"
      routerLink="/livros/cadastro"
    >
      Cadastrar livro
    </button>
  </div>

  <div class="filtros">

    <mat-form-field appearance="outline">

      <mat-label>Buscar por título</mat-label>

      <input
        matInput
        type="text"
        [(ngModel)]="tituloBusca"
        (keyup.enter)="pesquisar()"
      >

    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="pesquisar()"
    >
      Pesquisar
    </button>

    <button
      mat-stroked-button
      (click)="limparBusca()"
    >
      Limpar
    </button>

  </div>

  <div
    *ngIf="carregando"
    class="carregando"
  >
    Carregando livros...
  </div>

  <div
    class="tabela-container"
    *ngIf="!carregando && livros.length > 0"
  >

    <table mat-table [dataSource]="livros">

      <ng-container matColumnDef="titulo">

        <th mat-header-cell *matHeaderCellDef>
          Título
        </th>

        <td mat-cell *matCellDef="let livro">
          {{ livro.titulo }}
        </td>

      </ng-container>

      <ng-container matColumnDef="descricao">

        <th mat-header-cell *matHeaderCellDef>
          Descrição
        </th>

        <td mat-cell *matCellDef="let livro">
          {{ livro.descricao }}
        </td>

      </ng-container>

      <ng-container matColumnDef="categoria">

        <th mat-header-cell *matHeaderCellDef>
          Categoria
        </th>

        <td mat-cell *matCellDef="let livro">
          {{ livro.categoria }}
        </td>

      </ng-container>

      <ng-container matColumnDef="autor">

        <th mat-header-cell *matHeaderCellDef>
          Autor
        </th>

        <td mat-cell *matCellDef="let livro">
          {{ livro.autor }}
        </td>

      </ng-container>

      <ng-container matColumnDef="status">

        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>

        <td mat-cell *matCellDef="let livro">

          <span *ngIf="livro.status === LivroStatus.DISPONIVEL">
            Disponível
          </span>

          <span *ngIf="livro.status === LivroStatus.EMPRESTADO">
            Emprestado
          </span>

        </td>

      </ng-container>

      <ng-container matColumnDef="acoes">

        <th mat-header-cell *matHeaderCellDef>
          Ações
        </th>

        <td mat-cell *matCellDef="let livro">

          <button
            mat-icon-button
            color="primary"
            [routerLink]="['/livros/editar', livro.id]"
          >
            <mat-icon>edit</mat-icon>
          </button>

              <button
                mat-icon-button
                color="warn"
                (click)="excluirLivro(livro.id)"
              >
                <mat-icon>delete</mat-icon>
              </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="colunas"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: colunas;"
      ></tr>

    </table>

  </div>

  <div
    *ngIf="!carregando && livros.length === 0"
  >
    <p>Nenhum livro encontrado.</p>
  </div>

  <div
    class="paginacao"
    *ngIf="!carregando && livros.length > 0"
  >

    <button
      mat-stroked-button
      (click)="paginaAnterior()"
      [disabled]="paginaAtual === 0"
    >
      Anterior
    </button>

    <span>
      Página {{ paginaAtual + 1 }} de {{ totalPaginas }}
    </span>

    <button
      mat-stroked-button
      (click)="proximaPagina()"
      [disabled]="paginaAtual >= totalPaginas - 1"
    >
      Próxima
    </button>

  </div>

</div>
